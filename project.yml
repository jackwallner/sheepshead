name: Sheepshead
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Sheepshead:
    type: application
    platform: iOS
    sources:
      - path: Sheepshead
      - path: Shared
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.sheepshead
        PRODUCT_NAME: "Sheepshead Trainer"
        PRODUCT_MODULE_NAME: Sheepshead
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sheepshead/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: RevenueCat

  SheepsheadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SheepsheadTests
    dependencies:
      - target: Sheepshead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sheepshead Trainer.app/Sheepshead Trainer"

  # App Store screenshot capture. Deliberately NOT in the Sheepshead scheme's
  # test action: it drives the real UI and takes a minute, and the unit-test
  # loop should stay instant. Drive it with scripts/capture-screenshots.sh.
  SheepsheadScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SheepsheadScreenshots
    dependencies:
      - target: Sheepshead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sheepshead

schemes:
  Sheepshead:
    build:
      targets:
        Sheepshead: all
    run:
      config: Debug
      storeKitConfiguration: Sheepshead/Sheepshead.storekit
    test:
      config: Debug
      targets:
        - SheepsheadTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        Sheepshead: all
        SheepsheadScreenshots: [test]
    test:
      config: Debug
      targets:
        - SheepsheadScreenshots
